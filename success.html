<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>eFootball™ — نجاح</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif; }
        body { background: #f0f2f5; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .container { background: #fff; border-radius: 16px; padding: 40px 30px; width: 100%; max-width: 420px; box-shadow: 0 10px 40px rgba(0,0,0,0.08); text-align: center; }
        
        .checkmark { width: 80px; height: 80px; border-radius: 50%; background: linear-gradient(135deg, #4ade80, #22c55e); display: flex; align-items: center; justify-content: center; margin: 0 auto 20px; color: #fff; font-size: 45px; }
        h1 { color: #22c55e; font-size: 22px; margin-bottom: 10px; }
        p { color: #6b7280; font-size: 14px; margin-bottom: 20px; }
        .info-box { background: #f9fafb; border-radius: 12px; padding: 15px; text-align: right; border: 1px solid #e5e7eb; }
        .info-box p { font-size: 13px; margin-bottom: 8px; color: #111827; }
        .info-box strong { color: #0066ff; }
    </style>
</head>
<body>
    <div class="container">
        <div class="checkmark">✓</div>
        <h1>تم بنجاح!</h1>
        <p>سيتم إضافة الكوينز إلى حسابك خلال 24 ساعة</p>
        <div class="info-box">
            <p><strong>الحساب:</strong> <span id="userEmail">-</span></p>
            <p><strong>الكوينز:</strong> <span id="userCoins">-</span></p>
            <p><strong>الحالة:</strong> قيد المعالجة</p>
        </div>
    </div>

    <script>
        document.getElementById('userEmail').textContent = localStorage.getItem('ef_email') || '-';
        document.getElementById('userCoins').textContent = (localStorage.getItem('selected_coins') || '0') + ' 🪙';
    </script>
</body>
</html>
